services:
  postgres:
    networks: [database]
  server:
    networks: [application, database]
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?Set the container PostgreSQL URL with an encoded password}
  web:
    networks: [application, edge]
  migrate:
    networks: [database]
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL}
  mailpit:
    networks: [application]
  backup:
    networks: [database]
  restore:
    networks: [database]
  reconcile:
    networks: [database]
  proxy:
    image: caddy:2-alpine
    profiles: [app]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public hostname without scheme or port}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  database:
    internal: true
  application: {}
  edge: {}
volumes:
  caddy_data:
  caddy_config:
