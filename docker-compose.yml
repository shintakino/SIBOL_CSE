name: sibol-cse
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sibol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sibol}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles: [app]
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sibol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sibol}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_URL: ${SMTP_URL}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: builder
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sibol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sibol}
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://server:3000
    profiles: [app]
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://server:3000
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
